dataset_id = "duffing_nonlinearity_matrix_v1"
release_id = "duffing_nonlinearity_matrix_v1"
scope = "v1_core"
system_family = "duffing_hardening_nonlinearity_matrix"
generation_seed = 24052401
initial_condition_seed = 24052402
split_seed = 24052403

alpha = 1.0
delta = 0.08
gamma = 0.0
forcing_type = "force_none"

beta_values = [0.0, 0.05, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
amplitude_levels_Q = [0.25, 0.5, 1.0, 1.5, 2.0, 4.0]
linear_base_Q = 1.0

[profile.formal]
R_train = 384
R_val = 64
R_test = 64
M = 1024
tau = 0.01

[solver]
continuous_solver_name = "adaptive_dopri5_embedded"
discrete_solver_name = "exact_discrete_rotation"
reltol = 1.0e-10
abstol = 1.0e-12
max_internal_step = 0.002
energy_tolerance = 1.0e-8

[solver.extreme]
chi_threshold = 80.0
reltol = 1.0e-11
abstol = 1.0e-13
max_internal_step = 0.0005

[discrete_rotation]
damping_radius = 0.995
omega = 0.08
